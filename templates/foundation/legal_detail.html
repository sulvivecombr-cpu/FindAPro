{% extends 'base.html' %}
{% load static %}

{% block title %}{{ document.title }}{% endblock %}

{% block content %}
<article class="max-w-3xl mx-auto py-8 md:py-14">
    <a href="{% url 'foundation:legal' %}" class="fp-btn-ghost text-sm mb-6"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Documentos legais</a>
    <div class="flex items-center gap-3 flex-wrap">
        <h1 class="font-display text-2xl md:text-3xl font-bold tracking-tight">{{ document.title }}</h1>
        <span class="fp-chip">Versão {{ document.version }}</span>
    </div>
    <p class="mt-2 text-xs text-ink/50 dark:text-night-subtle">Publicado em {{ document.published_at|date:"d/m/Y \à\s H:i" }}</p>
    <div class="fp-card mt-6 p-6 md:p-8 text-sm leading-relaxed text-ink/90 dark:text-night-text/90 whitespace-pre-line">{{ document.content }}</div>
</article>
{% endblock %}
