{% extends 'base.html' %}
{% load static %}

{% block title %}Aceitar os termos{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-10 md:py-20">
    <h1 class="font-display text-2xl font-bold tracking-tight">Quase pronto!</h1>
    <p class="mt-2 text-sm text-ink/70 dark:text-night-subtle">
        Entrando com <strong>{{ google_email }}</strong>. Para concluir, aceite:
    </p>
    <form method="post" class="fp-card mt-6 p-6 space-y-4">
        {% csrf_token %}
        <label class="flex items-start gap-3 text-sm">
            <input type="checkbox" name="accept_terms" class="fp-checkbox">
            <span>Li e aceito os <a href="{{ terms_url }}" class="underline font-medium" target="_blank" rel="noopener">Termos de Uso</a></span>
        </label>
        <label class="flex items-start gap-3 text-sm">
            <input type="checkbox" name="accept_privacy" class="fp-checkbox">
            <span>Li e aceito a <a href="{{ privacy_url }}" class="underline font-medium" target="_blank" rel="noopener">Política de Privacidade</a> (LGPD)</span>
        </label>
        <button type="submit" class="fp-btn-primary w-full text-base">Concluir</button>
    </form>
</div>
{% endblock %}
