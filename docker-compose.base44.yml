# Base44 development environment for FindAPro (Django + Postgres).
# Runs the cloned source with a live-reload dev server — never a prebuilt image.
services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_DB: findapro
      POSTGRES_USER: findapro_user
      POSTGRES_PASSWORD: findapro_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findapro_user -d findapro"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.base44
    restart: on-failure
    command:
      - sh
      - -ec
      - |
        echo "Installing node dependencies..."
        npm install --legacy-peer-deps
        echo "Building Tailwind CSS (watching for changes)..."
        npx tailwindcss -i ./static/src/input.css -o ./static/css/output.css --minify || echo "Tailwind build skipped"
        (npx tailwindcss -i ./static/src/input.css -o ./static/css/output.css --watch >/dev/null 2>&1 &)
        echo "Applying database migrations..."
        python manage.py makemigrations accounts providers reviews core bcubed --noinput
        python manage.py migrate --noinput
        python manage.py collectstatic --noinput
        echo "Starting Django development server..."
        exec python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "3000:8000"
    environment:
      DEBUG: "1"
      POSTGRES_DB: findapro
      POSTGRES_USER: findapro_user
      POSTGRES_PASSWORD: findapro_password
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,.${BASE44_SANDBOX_HOST_DOMAIN}
      CSRF_TRUSTED_ORIGINS: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
    env_file:
      - /run/base44/app.env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  postgres_data:
